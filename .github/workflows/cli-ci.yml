name: cli-ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "apps/cli/**"
      - "apps/app/convex/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "oxlint.config.mjs"
      - ".github/workflows/cli-ci.yml"

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11.1.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13"
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.1"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter cli typecheck
      - name: Lint
        run: pnpm --filter cli lint
      - name: Test
        run: pnpm --filter cli test
      - name: Compile host binary and smoke it
        run: |
          pnpm --filter cli build:bin:host
          ./apps/cli/dist/hackspain --version
          ./apps/cli/dist/hackspain auth status --json --url https://app.example | jq -e '.ok == true and .data.loggedIn == false'
