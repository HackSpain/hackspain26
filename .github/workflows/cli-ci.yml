name: cli-ci

on:
  pull_request:
    paths:
      - "apps/cli/**"
      - "apps/app/convex/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cli-ci.yml"
  push:
    branches: [master]
    paths:
      - "apps/cli/**"
      - "apps/app/convex/**"

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter cli typecheck
      - name: Lint
        run: pnpm --filter cli lint
      - name: Test
        run: pnpm --filter cli test
      - name: Compile host binary and smoke it
        run: |
          pnpm --filter cli build:bin:host
          ./apps/cli/dist/hackspain --version
          ./apps/cli/dist/hackspain auth status --json --url https://app.example | jq -e '.ok == true and .data.loggedIn == false'
