name: cli-release
# Tag `cli-vX.Y.Z` on master to publish binaries for every platform.
# Binaries talk to https://hackspain.app; the optional repository
# variable HACKSPAIN_APP_URL overrides that at build time.
on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the binaries (e.g. 0.2.0)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: |
          pnpm --filter cli typecheck
          pnpm --filter cli test
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#cli-v}"
            package_version="$(node -p "require('./apps/cli/package.json').version")"
            if [[ "$tag_version" != "$package_version" ]]; then
              echo "::error::Release tag version $tag_version does not match apps/cli/package.json version $package_version" >&2
              exit 1
            fi
            echo "value=$tag_version" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build all targets
        env:
          HACKSPAIN_VERSION: ${{ steps.version.outputs.value }}
          HACKSPAIN_APP_URL_DEFAULT: ${{ vars.HACKSPAIN_APP_URL }}
        run: pnpm --filter cli build:bin
      - name: Smoke the linux binary
        run: |
          ./apps/cli/dist/hackspain-linux-x64 --version | grep -F "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hackspain-binaries
          path: |
            apps/cli/dist/hackspain-*
            apps/cli/dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: hackspain CLI ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            apps/cli/dist/hackspain-*
            apps/cli/dist/SHA256SUMS
