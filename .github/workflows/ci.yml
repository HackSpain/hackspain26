name: ci

on:
  pull_request:
    paths:
      - "apps/app/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  push:
    branches: [master]
    paths:
      - "apps/app/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # `on.paths` gates the whole workflow. This job decides which app a change touches
    # so the `app` and `web` jobs only run for their own files plus the shared root files.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            shared: &shared
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"
            app:
              - *shared
              - "apps/app/**"
            web:
              - *shared
              - "apps/web/**"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter app typecheck
      - name: "Lint (advisory until #235)"
        continue-on-error: true
        run: pnpm --filter app lint
      - name: Test
        run: pnpm --filter app test
      - name: Build
        run: pnpm --filter app build

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Astro check (advisory until #236)"
        continue-on-error: true
        run: pnpm --filter web check
      - name: "Lint (advisory until #235)"
        continue-on-error: true
        run: pnpm --filter web lint
      - name: Build
        run: pnpm --filter web build
