name: ci

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "apps/app/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "oxlint.config.mjs"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Keep the workflow present on every PR so required checks can complete.
    # Only run the app and web jobs for their own files plus shared root files.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            shared: &shared
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "oxlint.config.mjs"
              - ".github/workflows/ci.yml"
            app:
              - *shared
              - "apps/app/**"
            web:
              - *shared
              - "apps/web/**"

  gate-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting and lint on changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          app_files=()
          while IFS= read -r -d '' file; do
            app_files+=("${file#apps/app/}")
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD -- apps/app)
          if (( ${#app_files[@]} )); then
            (
              cd apps/app
              pnpm exec oxlint -c oxlint.config.mjs --report-unused-disable-directives-severity=error --no-error-on-unmatched-pattern "${app_files[@]}"
              pnpm exec biome format --no-errors-on-unmatched "${app_files[@]}"
            )
          fi

          web_files=()
          while IFS= read -r -d '' file; do
            web_files+=("${file#apps/web/}")
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD -- apps/web)
          if (( ${#web_files[@]} )); then
            (
              cd apps/web
              pnpm exec oxlint -c oxlint.config.mjs --report-unused-disable-directives-severity=error --no-error-on-unmatched-pattern "${web_files[@]}"
              pnpm exec biome check --no-errors-on-unmatched "${web_files[@]}"
            )
          fi

          if ! git diff --quiet "$BASE_SHA"...HEAD -- oxlint.config.mjs; then
            pnpm exec oxlint -c oxlint.config.mjs oxlint.config.mjs
          fi

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter app typecheck
      - name: "Lint (advisory until #235)"
        continue-on-error: true
        run: pnpm --filter app lint
      - name: Test
        run: pnpm --filter app test
      - name: Build
        run: pnpm --filter app build

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Astro check (advisory until #236)"
        continue-on-error: true
        run: pnpm --filter web check
      - name: "Lint (advisory until #235)"
        continue-on-error: true
        run: pnpm --filter web lint
      - name: Declared binaries
        run: pnpm --filter web knip:check
      - name: "Unused code report (advisory)"
        continue-on-error: true
        run: pnpm --filter web knip
      - name: Build
        run: pnpm --filter web build
