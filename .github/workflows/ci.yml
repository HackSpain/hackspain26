name: ci

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "apps/app/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "oxlint.config.mjs"
      - "scripts/anti-slop.test.mjs"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Keep the workflow present on every PR so required checks can complete.
    # Only run the app and web jobs for their own files plus shared root files.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            shared: &shared
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "oxlint.config.mjs"
              - ".github/workflows/ci.yml"
            app:
              - *shared
              - "apps/app/**"
            web:
              - *shared
              - "apps/web/**"

  gate-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify anti-slop rules and workspace inheritance
        run: pnpm lint:anti-slop:test
      - name: Check formatting and lint on changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          app_files=()
          while IFS= read -r -d '' file; do
            app_files+=("${file#apps/app/}")
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD -- apps/app)
          if (( ${#app_files[@]} )); then
            (
              cd apps/app
              pnpm exec oxlint -c oxlint.config.mjs --deny-warnings --report-unused-disable-directives-severity=error --no-error-on-unmatched-pattern "${app_files[@]}"
              pnpm exec biome format --no-errors-on-unmatched "${app_files[@]}"
            )
          fi

          web_files=()
          while IFS= read -r -d '' file; do
            web_files+=("${file#apps/web/}")
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD -- apps/web)
          if (( ${#web_files[@]} )); then
            (
              cd apps/web
              pnpm exec oxlint -c oxlint.config.mjs --deny-warnings --report-unused-disable-directives-severity=error --no-error-on-unmatched-pattern "${web_files[@]}"
              pnpm exec biome check --error-on-warnings --no-errors-on-unmatched "${web_files[@]}"
            )
          fi

          if ! git diff --quiet "$BASE_SHA"...HEAD -- oxlint.config.mjs scripts/anti-slop.test.mjs; then
            pnpm exec oxlint -c oxlint.config.mjs --deny-warnings --report-unused-disable-directives-severity=error oxlint.config.mjs scripts/anti-slop.test.mjs
          fi

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter app typecheck
      - name: Lint
        run: pnpm --filter app lint
      - name: Format
        run: pnpm --filter app format:check
      - name: Test
        run: pnpm --filter app test
      - name: Build
        run: pnpm --filter app build

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.1.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Astro check
        run: pnpm --filter web check
      - name: Lint
        run: pnpm --filter web lint
      - name: Format
        run: pnpm --filter web format:check
      - name: Unused code and dependencies
        run: pnpm --filter web knip:check
      - name: Test
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build
